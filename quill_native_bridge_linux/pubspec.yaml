name: quill_native_bridge_linux
description: "Linux implementation of the quill_native_bridge plugin."
version: 0.1.0
homepage: https://github.com/Sebastien-VZN/quill_native_bridge_robust
repository: https://github.com/Sebastien-VZN/quill_native_bridge_robust
issue_tracker: https://github.com/Sebastien-VZN/quill_native_bridge_robust/issues
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  quill_native_bridge_platform_interface:
    path: ../quill_native_bridge_platform_interface
  file_selector_linux: ^0.9.1+1
  file_selector_platform_interface: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0
  crypto: ^3.0.5
  yaml: ^3.1.2
  mockito: ^5.4.4
  build_runner: ^2.4.13

flutter:
  assets:
    - path: assets/xclip
      platforms: [linux]
  plugin:
    implements: quill_native_bridge
    platforms:
      linux:
        dartPluginClass: QuillNativeBridgeLinux
        fileName: quill_native_bridge_linux.dart