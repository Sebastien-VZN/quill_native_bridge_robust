name: quill_native_bridge_workspace
repository: https://github.com/Sebastien-VZN/quill_native_bridge_robust
publish_to: 'none'

workspace:
  - quill_native_bridge
  - quill_native_bridge/example
  - quill_native_bridge_android
  - quill_native_bridge_ios
  - quill_native_bridge_linux
  - quill_native_bridge_macos
  - quill_native_bridge_platform_interface
  - quill_native_bridge_web
  - quill_native_bridge_windows

environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter

dependency_overrides:
  dart_quill_delta:
    git:
      url: https://github.com/Sebastien-VZN/dart_quill_delta_robust.git
  flutter_quill_delta_from_html:
    git:
      url: https://github.com/Sebastien-VZN/flutter_quill_delta_from_html_robust.git
